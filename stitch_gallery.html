<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Stitch Mobil Ekran Galerisi · Apple Pro Theme (YZM301)</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.65);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2997ff;
      --text: #f5f5f7;
      --text-muted: #86868b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; letter-spacing: -0.01em; }
    body { background: var(--bg); color: var(--text); padding: 40px 20px; }
    header { max-width: 1300px; margin: 0 auto 36px; text-align: center; }
    .badge { background: rgba(41, 151, 255, 0.12); color: #2997ff; border: 1px solid rgba(41, 151, 255, 0.3); padding: 4px 14px; border-radius: 980px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    h1 { font-size: 32px; font-weight: 700; margin-top: 12px; letter-spacing: -0.025em; background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
    .gallery-grid { max-width: 1340px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(410px, 1fr)); gap: 32px; justify-items: center; }
    .screen-card { background: var(--card-bg); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 32px; padding: 20px; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    .screen-meta { width: 100%; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .screen-title { font-size: 13px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 0.04em; }
    .screen-link { font-size: 12px; color: #2997ff; text-decoration: none; font-weight: 600; background: rgba(41, 151, 255, 0.12); border: 1px solid rgba(41, 151, 255, 0.25); padding: 4px 12px; border-radius: 980px; transition: all 0.2s; }
    .screen-link:hover { background: rgba(41, 151, 255, 0.25); transform: translateY(-1px); }
    iframe { width: 400px; height: 852px; border: none; border-radius: 54px; box-shadow: 0 30px 80px rgba(0,0,0,0.9); background: #000; }
  </style>
</head>
<body>
  <header>
    <span class="badge">YZM301 · GOOGLE STITCH · APPLE PRO EDITION</span>
    <h1>SE Primer: 3 Mobil Ekran Mimarisi</h1>
    <p>iPhone 16 Pro Titanium & Dynamic Island standartlarında 390x852 canlı prototipler</p>
  </header>

  <div class="gallery-grid">
    <!-- Ekran 1 -->
    <div class="screen-card">
      <div class="screen-meta">
        <span class="screen-title">1. Giriş & Kişiselleştirme</span>
        <a href="stitch_screen_1_onboarding.html" target="_blank" class="screen-link">Tam Ekran Aç ↗</a>
      </div>
      <iframe src="stitch_screen_1_onboarding.html" title="Stitch Ekran 1"></iframe>
    </div>

    <!-- Ekran 2 -->
    <div class="screen-card">
      <div class="screen-meta">
        <span class="screen-title">2. Kriz, Karar & AI Tutor</span>
        <a href="stitch_screen_2_crisis.html" target="_blank" class="screen-link">Tam Ekran Aç ↗</a>
      </div>
      <iframe src="stitch_screen_2_crisis.html" title="Stitch Ekran 2"></iframe>
    </div>

    <!-- Ekran 3 -->
    <div class="screen-card">
      <div class="screen-meta">
        <span class="screen-title">3. Sonuç & Post-Mortem</span>
        <a href="stitch_screen_3_outcome.html" target="_blank" class="screen-link">Tam Ekran Aç ↗</a>
      </div>
      <iframe src="stitch_screen_3_outcome.html" title="Stitch Ekran 3"></iframe>
    </div>
  </div>
</body>
</html>
